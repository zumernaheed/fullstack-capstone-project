services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./giftlink-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: giftlink
      JWT_SECRET: local-docker-secret-change-me
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./giftlink-frontend
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
